name: Package Node.js

on:
  push:
    tags:
      - v*

concurrency:
  group: package-nodejs-${{ forgejo.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.2"
  NODE_VERSION: "20"
  PULUMI_VERSION: "3.232.0"
  PACKAGE_USERNAME: ${{ forgejo.repository_owner }}
  PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  REGISTRY_URL: https://forgejo.siron.casa/api/packages/${{ forgejo.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install system tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git perl unzip

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: https://github.com/actions/cache@v4
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Install Pulumi
        run: |
          set -eu
          export PATH="$HOME/.pulumi/bin:$PATH"
          if ! command -v pulumi >/dev/null; then
            curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          fi
          echo "$HOME/.pulumi/bin" >> "${FORGEJO_PATH:-$GITHUB_PATH}"

      - name: Generate Node.js SDK
        env:
          FORGEJO_PROVIDER_VERSION: ${{ forgejo.ref_name }}
          FORGEJO_SDK_LANGUAGES: nodejs
        run: |
          set -eu
          version=${FORGEJO_PROVIDER_VERSION#v}
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/pulumi-resource-forgejo ./cmd/pulumi-resource-forgejo
          pulumi package get-schema ./bin/pulumi-resource-forgejo > schema.json
          scripts/gen-sdk.sh

      - name: Publish Node.js package
        working-directory: sdk/nodejs
        run: |
          set -eu
          NPM_SCOPE="@${PACKAGE_USERNAME}"
          auth_path=${REGISTRY_URL#https:}
          auth_path=${auth_path#http:}
          npm config set "${NPM_SCOPE}:registry" "${REGISTRY_URL}/npm/"
          npm config set -- "${auth_path}/npm/:_authToken" "$PACKAGE_TOKEN"
          npm install --ignore-scripts
          npm run build
          npm publish --scope="$NPM_SCOPE" --registry="${REGISTRY_URL}/npm/"
