name: CI

env:
  GO_VERSION: "1.26.2"
  PULUMI_VERSION: "3.232.0"
  GOLANGCI_LINT_VERSION: v2.11.4
  GIT_CLIFF_VERSION: 2.13.1

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system tools
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            perl \
            unzip
          rm -rf /var/lib/apt/lists/*

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Pulumi
        run: |
          set -eu
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "${FORGEJO_PATH:-$GITHUB_PATH}"

      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: git-cliff@${{ env.GIT_CLIFF_VERSION }}

      - name: Determine provider version
        id: version
        run: |
          set -eu
          version=$(git-cliff --bumped-version)
          version=${version#v}
          output_file=${FORGEJO_OUTPUT:-${GITHUB_OUTPUT:-}}
          if [ -z "$output_file" ]; then
            printf 'No action output file is available\n'
            exit 1
          fi
          printf 'Provider version: %s\n' "$version"
          printf 'version=%s\n' "$version" >> "$output_file"

      - name: Tidy Go modules
        run: go mod tidy

      - name: Lint Go code
        uses: https://github.com/golangci/golangci-lint-action@v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./cmd/... ./internal/...
          github-token: ""
          skip-cache: true

      - name: Format Go code
        run: golangci-lint fmt

      - name: Run Go tests
        run: go test ./...

      - name: Build provider
        env:
          FORGEJO_PROVIDER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          mkdir -p bin
          version=$FORGEJO_PROVIDER_VERSION
          version=${version#v}
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/pulumi-resource-forgejo ./cmd/pulumi-resource-forgejo

      - name: Export schema
        run: pulumi package get-schema ./bin/pulumi-resource-forgejo > schema.json

      - name: Generate SDKs
        env:
          FORGEJO_PROVIDER_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/gen-sdk.sh

      - name: Check generated files
        run: git diff --exit-code
