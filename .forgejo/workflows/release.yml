name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version override, with or without leading v
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: "1.27.1"
  # renovate: datasource=github-releases depName=pulumi/pulumi
  PULUMI_VERSION: "3.256.0"
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.13.2
  # renovate: datasource=github-releases depName=caarlos0/svu
  SVU_VERSION: v3.4.1
  # renovate: datasource=github-releases depName=nodejs/node
  NODE_VERSION: "v26.5.1"
  # renovate: datasource=dotnet-version depName=dotnet-sdk
  DOTNET_VERSION: "8.0.424"
  # renovate: datasource=java-version depName=java
  JAVA_VERSION: "11.0.32+9"
  # renovate: datasource=gradle-version depName=gradle
  GRADLE_VERSION: "8.14.5"
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: "2.17.1"
  PACKAGE_OWNER: ${{ forgejo.repository_owner }}
  PACKAGE_USERNAME: ${{ forgejo.repository_owner }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install version tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@${{ env.SVU_VERSION }}

      - name: Determine release version
        id: version
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -eu
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(svu next)
          fi
          version=${version#v}
          tag="v$version"
          should_release=true

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf 'Release tag %s already exists; skipping release pipeline\n' "$tag"
            should_release=false
          fi

          if [ "$should_release" = true ]; then
            auth_header=
            if [ -n "${FORGEJO_TOKEN:-}" ]; then
              auth_header="Authorization: token ${FORGEJO_TOKEN}"
            fi
            if [ -n "$auth_header" ]; then
              http_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --header "$auth_header" \
                "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/releases/tags/$tag")
            else
              http_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/releases/tags/$tag")
            fi
            if [ "$http_status" = "200" ]; then
              printf 'Forgejo release %s already exists; skipping release pipeline\n' "$tag"
              should_release=false
            elif [ "$http_status" != "404" ]; then
              printf 'Could not check Forgejo release %s, API returned HTTP %s\n' "$tag" "$http_status"
              exit 1
            fi
          fi

          output_file=${FORGEJO_OUTPUT:-${GITHUB_OUTPUT:-}}
          if [ -z "$output_file" ]; then
            printf 'No action output file is available\n'
            exit 1
          fi
          printf 'Release version: %s (should_release=%s)\n' "$version" "$should_release"
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'should_release=%s\n' "$should_release"
          } >> "$output_file"

  go-validation:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go validation tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Tidy Go modules
        run: go mod tidy

      - name: Lint Go code
        uses: https://github.com/golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./cmd/... ./internal/...
          github-token: ""

      - name: Format Go code
        run: golangci-lint fmt

      - name: Run Go tests
        run: go test ./...

      - name: Check source files
        run: |
          set -eu
          if [ -n "$(git status --short)" ]; then
            git status --short
            git diff
            exit 1
          fi

  sdk-validation:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SDK validation tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git perl unzip

      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Install Pulumi
        run: |
          set -eu
          export PATH="$HOME/.pulumi/bin:$PATH"
          if ! command -v pulumi >/dev/null; then
            curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          fi
          echo "$HOME/.pulumi/bin" >> "${FORGEJO_PATH:-$GITHUB_PATH}"

      - name: Build provider
        env:
          FORGEJO_PROVIDER_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p bin
          version=$FORGEJO_PROVIDER_VERSION
          version=${version#v}
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/pulumi-resource-forgejo ./cmd/pulumi-resource-forgejo

      - name: Export schema
        run: pulumi package get-schema ./bin/pulumi-resource-forgejo > schema.json

      - name: Generate release SDKs
        env:
          FORGEJO_PROVIDER_VERSION: ${{ needs.version.outputs.version }}
        run: scripts/gen-sdk.sh

      - name: Archive SDKs
        run: tar -czf sdks.tar.gz sdk/

      - name: Upload SDKs
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: sdks
          path: sdks.tar.gz

  forgejo-release:
    needs:
      - version
      - go-validation
      - sdk-validation
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Install release tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git perl unzip zip

      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Install Pulumi
        run: |
          set -eu
          export PATH="$HOME/.pulumi/bin:$PATH"
          if ! command -v pulumi >/dev/null; then
            curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          fi
          echo "$HOME/.pulumi/bin" >> "${FORGEJO_PATH:-$GITHUB_PATH}"

      - name: Install GoReleaser
        uses: https://github.com/goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: Create release tag
        run: |
          set -eu
          tag="${{ needs.version.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf 'release tag %s already exists; refusing to release\n' "$tag"
            exit 1
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"

      - name: Create Forgejo release with GoReleaser
        run: |
          set -eu
          printf '%s' "$FORGEJO_TOKEN" > .goreleaser-forgejo-token
          trap 'rm -f .goreleaser-forgejo-token' EXIT
          goreleaser release --clean --parallelism 1
        env:
          GORELEASER_FORCE_TOKEN: gitea
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}
          FORGEJO_PROVIDER_VERSION: ${{ needs.version.outputs.version }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GOMEMLIMIT: 2GiB

  package-nodejs:
    needs:
      - version
      - sdk-validation
      - forgejo-release
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      REGISTRY_URL: ${{ forgejo.server_url }}/api/packages/${{ forgejo.repository_owner }}/npm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download SDKs
        uses: https://code.forgejo.org/forgejo/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: sdks

      - name: Extract SDKs
        run: tar -xzf sdks.tar.gz

      - name: Install system tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git perl unzip

      - uses: https://github.com/actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Publish Node.js package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}"
        run: |
          set -eu
          cd sdk/nodejs
          npm config set @${FORGEJO_REPOSITORY_OWNER}:registry $REGISTRY_URL
          npm config set -- '//forgejo.siron.casa/api/packages/${{ forgejo.repository_owner }}/npm/:_authToken' $PACKAGE_TOKEN
          npm install --ignore-scripts
          echo 'Install successful'
          npm run build
          echo 'Ran build process'
          npm publish --access public --scope=@${FORGEJO_REPOSITORY_OWNER} --registry=$REGISTRY_URL

  package-go:
    needs:
      - version
      - sdk-validation
      - forgejo-release
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      REGISTRY_URL: https://forgejo.siron.casa/api/packages/${{ forgejo.repository_owner }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download SDKs
        uses: https://code.forgejo.org/forgejo/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: sdks

      - name: Extract SDKs
        run: tar -xzf sdks.tar.gz

      - name: Install system tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git perl unzip zip

      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Publish Go package
        env:
          FORGEJO_PROVIDER_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          tag="v${FORGEJO_PROVIDER_VERSION#v}"
          module=$(go -C sdk/go list -m)
          archive="$PWD/pulumi-forgejo-go-${tag}.zip"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "${tmp}/${module}@${tag}"
          cp -R sdk/go/. "${tmp}/${module}@${tag}/"
          (cd "$tmp" && zip -D -qr "$archive" "${module}@${tag}")
          curl --fail --silent --show-error \
            --user "${PACKAGE_USERNAME}:${PACKAGE_TOKEN}" \
            --upload-file "$archive" \
            "${REGISTRY_URL}/go/upload"

  package-dotnet:
    needs:
      - version
      - sdk-validation
      - forgejo-release
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      REGISTRY_URL: https://forgejo.siron.casa/api/packages/${{ forgejo.repository_owner }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download SDKs
        uses: https://code.forgejo.org/forgejo/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: sdks

      - name: Extract SDKs
        run: tar -xzf sdks.tar.gz

      - uses: https://github.com/actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Publish .NET package
        env:
          FORGEJO_PROVIDER_VERSION: ${{ needs.version.outputs.version }}
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
        run: |
          set -eu
          version=${FORGEJO_PROVIDER_VERSION#v}
          rm -rf sdk/dotnet/nupkg
          dotnet build sdk/dotnet/Pulumi.Forgejo.csproj --configuration Release -p:Version="$version" -p:GeneratePackageOnBuild=false
          dotnet pack sdk/dotnet/Pulumi.Forgejo.csproj --configuration Release --no-build --output sdk/dotnet/nupkg -p:Version="$version" -p:GeneratePackageOnBuild=false
          dotnet nuget remove source forgejo >/dev/null 2>&1 || true
          dotnet nuget add source "${REGISTRY_URL}/nuget/index.json" --name forgejo --username "$PACKAGE_USERNAME" --password "$PACKAGE_TOKEN" --store-password-in-clear-text
          dotnet nuget push sdk/dotnet/nupkg/*.nupkg --source forgejo --api-key "$PACKAGE_TOKEN" --skip-duplicate

  package-java:
    needs:
      - version
      - sdk-validation
      - forgejo-release
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      REGISTRY_URL: https://forgejo.siron.casa/api/packages/${{ forgejo.repository_owner }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download SDKs
        uses: https://code.forgejo.org/forgejo/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: sdks

      - name: Extract SDKs
        run: tar -xzf sdks.tar.gz

      - uses: https://github.com/actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: https://github.com/gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Publish Java package
        env:
          FORGEJO_PROVIDER_VERSION: ${{ needs.version.outputs.version }}
          PUBLISH_REPO_URL: https://forgejo.siron.casa/api/packages/${{ forgejo.repository_owner }}/maven
          PUBLISH_REPO_USERNAME: ${{ env.PACKAGE_USERNAME }}
          PUBLISH_REPO_PASSWORD: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          set -eu
          PACKAGE_VERSION=${FORGEJO_PROVIDER_VERSION#v} gradle --no-daemon -p sdk/java publish
