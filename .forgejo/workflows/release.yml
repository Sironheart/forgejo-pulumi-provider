name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version override, with or without leading v
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.2"
  NODE_VERSION: "20"
  DOTNET_VERSION: "8.0.x"
  JAVA_VERSION: "11"
  GRADLE_VERSION: "8.10"
  PULUMI_VERSION: "3.232.0"
  GORELEASER_VERSION: "2.15.4"
  GOLANGCI_LINT_VERSION: v2.11.4
  SVU_VERSION: v3.4.0
  PACKAGE_OWNER: ${{ forgejo.repository_owner }}
  PACKAGE_USERNAME: ${{ forgejo.repository_owner }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install version tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@${{ env.SVU_VERSION }}

      - name: Determine release version
        id: version
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -eu
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(svu next)
          fi
          version=${version#v}
          tag="v$version"
          should_release=true

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf 'Release tag %s already exists; skipping release pipeline\n' "$tag"
            should_release=false
          fi

          if [ "$should_release" = true ]; then
            auth_header=
            if [ -n "${FORGEJO_TOKEN:-}" ]; then
              auth_header="Authorization: token ${FORGEJO_TOKEN}"
            fi
            if [ -n "$auth_header" ]; then
              http_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --header "$auth_header" \
                "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/releases/tags/$tag")
            else
              http_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/releases/tags/$tag")
            fi
            if [ "$http_status" = "200" ]; then
              printf 'Forgejo release %s already exists; skipping release pipeline\n' "$tag"
              should_release=false
            elif [ "$http_status" != "404" ]; then
              printf 'Could not check Forgejo release %s, API returned HTTP %s\n' "$tag" "$http_status"
              exit 1
            fi
          fi

          output_file=${FORGEJO_OUTPUT:-${GITHUB_OUTPUT:-}}
          if [ -z "$output_file" ]; then
            printf 'No action output file is available\n'
            exit 1
          fi
          printf 'Release version: %s (should_release=%s)\n' "$version" "$should_release"
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'should_release=%s\n' "$should_release"
          } >> "$output_file"

  go-validation:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install Go validation tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Tidy Go modules
        run: go mod tidy

      - name: Lint Go code
        uses: https://github.com/golangci/golangci-lint-action@v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./cmd/... ./internal/...
          github-token: ""

      - name: Format Go code
        run: golangci-lint fmt

      - name: Run Go tests
        run: go test ./...

      - name: Check source files
        run: |
          set -eu
          if [ -n "$(git status --short)" ]; then
            git status --short
            git diff
            exit 1
          fi

  sdk-validation:
    needs:
      - version
      - go-validation
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install SDK validation tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git perl unzip

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: https://github.com/actions/cache@v4
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Install Pulumi
        run: |
          set -eu
          export PATH="$HOME/.pulumi/bin:$PATH"
          if ! command -v pulumi >/dev/null; then
            curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          fi
          echo "$HOME/.pulumi/bin" >> "${FORGEJO_PATH:-$GITHUB_PATH}"

      - name: Install GoReleaser
        uses: https://github.com/goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: Build provider
        env:
          FORGEJO_PROVIDER_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p bin
          version=$FORGEJO_PROVIDER_VERSION
          version=${version#v}
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/pulumi-resource-forgejo ./cmd/pulumi-resource-forgejo

      - name: Export schema
        run: pulumi package get-schema ./bin/pulumi-resource-forgejo > schema.json

      - name: Generate release SDKs
        env:
          FORGEJO_PROVIDER_VERSION: ${{ needs.version.outputs.version }}
        run: scripts/gen-sdk.sh

      - name: Check generated files
        run: |
          set -eu
          if [ -n "$(git status --short)" ]; then
            git status --short
            git diff
            exit 1
          fi

  forgejo-release:
    needs:
      - version
      - sdk-validation
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Install release tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git perl unzip zip

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - uses: https://github.com/actions/cache@v4
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Install Pulumi
        run: |
          set -eu
          export PATH="$HOME/.pulumi/bin:$PATH"
          if ! command -v pulumi >/dev/null; then
            curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          fi
          echo "$HOME/.pulumi/bin" >> "${FORGEJO_PATH:-$GITHUB_PATH}"

      - name: Install GoReleaser
        uses: https://github.com/goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: Create release tag
        run: |
          set -eu
          tag="${{ needs.version.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf 'release tag %s already exists; refusing to release\n' "$tag"
            exit 1
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"

      - name: Create Forgejo release with GoReleaser
        run: |
          set -eu
          printf '%s' "$FORGEJO_TOKEN" > .goreleaser-forgejo-token
          trap 'rm -f .goreleaser-forgejo-token' EXIT
          goreleaser release --clean
        env:
          GORELEASER_FORCE_TOKEN: gitea
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}
          FORGEJO_PROVIDER_VERSION: ${{ needs.version.outputs.version }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
