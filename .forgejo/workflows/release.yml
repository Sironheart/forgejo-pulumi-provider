name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, with or without leading v
        required: true
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: docker
    container:
      image: node:20-bookworm
    env:
      PACKAGE_OWNER: ${{ forgejo.repository_owner }}
      PACKAGE_USERNAME: ${{ forgejo.actor }}
      PACKAGE_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      REGISTRY_URL: ${{ forgejo.server_url }}/api/packages/${{ forgejo.repository_owner }}
      GITEA_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        run: |
          set -eu
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$FORGEJO_REF_NAME"
          fi
          version=${version#v}
          tag="v$version"
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf 'release tag %s does not exist\n' "$tag"
            exit 1
          fi
          git checkout "$tag"
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
          } >> "$FORGEJO_OUTPUT"

      - name: Install system tools
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            openjdk-17-jdk-headless \
            python3 \
            python3-pip \
            python3-venv \
            unzip
          rm -rf /var/lib/apt/lists/*

      - name: Install mise
        run: |
          set -eu
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$FORGEJO_PATH"

      - name: Install project toolchain
        run: mise install

      - name: Generate release SDKs and schema
        run: FORGEJO_PROVIDER_VERSION="${{ steps.version.outputs.version }}" mise run sdk

      - name: Create Forgejo release with GoReleaser
        run: mise exec -- goreleaser release --clean

      - name: Publish Go SDK module package
        run: |
          set -eu
          module=$(mise exec -- go list -m)
          tag="${{ steps.version.outputs.tag }}"
          archive="pulumi-forgejo-go-${tag}.zip"
          git add -A sdk schema.json
          tree=$(git write-tree)
          git archive --format=zip --prefix="${module}@${tag}/" "$tree" --output="$archive"
          curl --fail --silent --show-error \
            --user "${PACKAGE_USERNAME}:${PACKAGE_TOKEN}" \
            --upload-file "$archive" \
            "${REGISTRY_URL}/go/upload"

      - name: Build and publish Node.js SDK package
        working-directory: sdk/nodejs
        run: |
          set -eu
          auth_path=${REGISTRY_URL#https:}
          auth_path=${auth_path#http:}
          npm config set @sironheart:registry "${REGISTRY_URL}/npm/"
          npm config set -- "${auth_path}/npm/:_authToken" "$PACKAGE_TOKEN"
          npm install --ignore-scripts
          npm run build
          npm publish --access public --registry "${REGISTRY_URL}/npm/"

      - name: Build and publish Python SDK package
        run: |
          set -eu
          rm -rf sdk/python/dist
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip build twine
          python -m build sdk/python
          python -m twine upload \
            --repository-url "${REGISTRY_URL}/pypi" \
            --username "$PACKAGE_USERNAME" \
            --password "$PACKAGE_TOKEN" \
            --skip-existing \
            sdk/python/dist/*

      - name: Install .NET SDK
        run: |
          set -eu
          curl -fsSL https://dot.net/v1/dotnet-install.sh --output dotnet-install.sh
          sh dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$FORGEJO_PATH"

      - name: Pack and publish .NET SDK package
        run: |
          set -eu
          rm -rf sdk/dotnet/nupkg
          dotnet pack sdk/dotnet/Pulumi.Forgejo.csproj --configuration Release --output sdk/dotnet/nupkg -p:Version=${{ steps.version.outputs.version }}
          dotnet nuget push sdk/dotnet/nupkg/*.nupkg --source "${REGISTRY_URL}/nuget/index.json" --api-key "$PACKAGE_TOKEN" --skip-duplicate

      - name: Install Gradle
        run: |
          set -eu
          mkdir -p "$HOME/.local/opt"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10-bin.zip --output gradle.zip
          unzip -q gradle.zip -d "$HOME/.local/opt"
          echo "$HOME/.local/opt/gradle-8.10/bin" >> "$FORGEJO_PATH"

      - name: Publish Java SDK package
        run: gradle --no-daemon -p sdk/java publish
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_REPO_URL: ${{ env.REGISTRY_URL }}/maven
          PUBLISH_REPO_USERNAME: ${{ env.PACKAGE_USERNAME }}
          PUBLISH_REPO_PASSWORD: ${{ secrets.FORGEJO_TOKEN }}
