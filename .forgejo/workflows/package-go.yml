name: Package Go

on:
  push:
    tags:
      - v*

concurrency:
  group: package-go-${{ forgejo.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.2"
  PULUMI_VERSION: "3.232.0"
  PACKAGE_USERNAME: ${{ forgejo.repository_owner }}
  PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
  REGISTRY_URL: https://forgejo.siron.casa/api/packages/${{ forgejo.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install system tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git perl unzip zip

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: https://github.com/actions/cache@v4
        with:
          path: ~/.pulumi/bin
          key: pulumi-${{ env.PULUMI_VERSION }}

      - name: Install Pulumi
        run: |
          set -eu
          export PATH="$HOME/.pulumi/bin:$PATH"
          if ! command -v pulumi >/dev/null; then
            curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          fi
          echo "$HOME/.pulumi/bin" >> "${FORGEJO_PATH:-$GITHUB_PATH}"

      - name: Generate Go SDK
        env:
          FORGEJO_PROVIDER_VERSION: ${{ forgejo.ref_name }}
          FORGEJO_SDK_LANGUAGES: go
        run: |
          set -eu
          version=${FORGEJO_PROVIDER_VERSION#v}
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/pulumi-resource-forgejo ./cmd/pulumi-resource-forgejo
          pulumi package get-schema ./bin/pulumi-resource-forgejo > schema.json
          scripts/gen-sdk.sh

      - name: Publish Go package
        env:
          FORGEJO_PROVIDER_VERSION: ${{ forgejo.ref_name }}
        run: |
          set -eu
          tag="v${FORGEJO_PROVIDER_VERSION#v}"
          module=$(go -C sdk/go list -m)
          archive="$PWD/pulumi-forgejo-go-${tag}.zip"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "${tmp}/${module}@${tag}"
          cp -R sdk/go/. "${tmp}/${module}@${tag}/"
          (cd "$tmp" && zip -qr "$archive" "${module}@${tag}")
          curl --fail --silent --show-error \
            --user "${PACKAGE_USERNAME}:${PACKAGE_TOKEN}" \
            --upload-file "$archive" \
            "${REGISTRY_URL}/go/upload"
