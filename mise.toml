[tools]
go = "1.27.1"
pulumi = "3.261.0"
jq = "1.8.2"
"github:caarlos0/svu" = "3.4.1"
goreleaser = "2.18.1"
golangci-lint = "2.13.2"

[tasks.fmt]
description = "Format Go sources with golangci-lint"
run = "golangci-lint fmt"

[tasks.tidy]
description = "Synchronize Go module files"
run = "go mod tidy"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.lint]
description = "Run Go linters"
run = "golangci-lint run ./cmd/... ./internal/..."

[tasks.version]
description = "Calculate the next semantic version"
run = "svu next"

[tasks.build]
description = "Build the Pulumi provider plugin"
run = "mkdir -p bin && version=${FORGEJO_PROVIDER_VERSION:-$(svu next)} && version=${version#v} && go build -trimpath -ldflags \"-s -w -X main.version=$version\" -o bin/pulumi-resource-forgejo ./cmd/pulumi-resource-forgejo"

[tasks.schema]
description = "Build plugin and export Pulumi schema"
depends = ["build"]
run = "pulumi package get-schema ./bin/pulumi-resource-forgejo > schema.json"

[tasks.sdk]
description = "Generate SDKs for published Pulumi languages"
depends = ["build"]
run = "scripts/gen-sdk.sh"

[tasks.release-check]
description = "Validate the GoReleaser configuration"
run = "goreleaser check"

[tasks.check-prepare]
description = "Prepare sources for validation"
depends = ["tidy", "fmt"]
hide = true

[tasks.check-lint]
description = "Run linters after preparation"
depends = ["check-prepare"]
run = "golangci-lint run ./cmd/... ./internal/..."
hide = true

[tasks.check-test]
description = "Run tests after preparation"
depends = ["check-prepare"]
run = "go test ./..."
hide = true

[tasks.check-build]
description = "Build provider after preparation"
depends = ["check-prepare"]
run = "mkdir -p bin && version=${FORGEJO_PROVIDER_VERSION:-$(svu next)} && version=${version#v} && go build -trimpath -ldflags \"-s -w -X main.version=$version\" -o bin/pulumi-resource-forgejo ./cmd/pulumi-resource-forgejo"
hide = true

[tasks.check]
description = "Run formatting, linting, tests, and provider build"
depends = ["check-lint", "check-test", "check-build"]
