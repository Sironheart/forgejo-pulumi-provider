[tools]
go = "1.26.2"
pulumi = "3.232.0"
jq = "1.8.1"
git-cliff = "2.13.1"
goreleaser = "2.15.4"

[tasks.fmt]
description = "Format Go sources"
run = "go fmt ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.build]
description = "Build the Pulumi provider plugin"
run = "mkdir -p bin && version=${FORGEJO_PROVIDER_VERSION:-0.0.0-dev} && version=${version#v} && go build -trimpath -ldflags \"-s -w -X main.version=$version\" -o bin/pulumi-resource-forgejo ./cmd/pulumi-resource-forgejo"

[tasks.schema]
description = "Build plugin and export Pulumi schema"
depends = ["build"]
run = "pulumi package get-schema ./bin/pulumi-resource-forgejo > schema.json"

[tasks.sdk]
description = "Generate SDKs for all standard Pulumi languages"
depends = ["schema"]
run = "scripts/gen-sdk.sh"

[tasks.changelog]
description = "Preview the unreleased changelog"
run = "git-cliff --unreleased --strip header"

[tasks.release-check]
description = "Validate the GoReleaser configuration"
run = "goreleaser check"

[tasks.check]
description = "Run formatting, tests, schema export, and all SDK generation"
run = "go mod tidy && go fmt ./... && go test ./... && mise run sdk"
